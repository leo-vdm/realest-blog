<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link id="style_colors" rel="stylesheet" href="colors_light.css">
    <link rel="stylesheet" href="index.css">
    <link rel="icon" href="vista_netcenter.ico" type="image/x-icon">
</head>
<body>
<div id="content_root">
    <div id="content_area_border">
        <div id="window_titlebar">
            <img src="explorer.ico" id="window_icon"/>
            <div id="window_title">
                C:\Home - File Explorer
            </div>
        </div>
        <div id="window_dragbar" draggable="true" ondrag="on_window_dragged(event)"></div>
        <div id="content_area_outer">
            <div id="content_area_inner">
                <div id="top_bar">
                    <button class="top_bar_button" onclick="on_home_clicked()">
                    Home
                    </button>
                    <button class="top_bar_button" onclick="on_blog_clicked()">
                    Blog
                    </button>
                    <input type="checkbox" name="darkmode_checkbox" id="darkmode_checkbox" onchange="on_toggle_darkmode(event, this)"/>
                    <label for="darkmode_checkbox" id="darkmode_label">Darkmode</label><br>
                </div>
                <div id="content_target">
                </div>
            </div>
        </div>
    </div>
</div>

<template id="article_row_template">
    <div id="article_row_container">
        <img id="article_row_image" onerror="this.src='missing.png'"/>
        <div id="article_row_right">
            <div id="article_row_title"></div>
            <div id="article_row_description"></div>
        </div>
    </div>
</template>

<template id="text_copied_template">
    <div id="text_copied_container">
        Copied!
    </div>
</template>

<div id="hidden_drag_ghost"></div>

<script src="index.js"></script>
<script id="dynamic_script"></script>
</body>
</html>
